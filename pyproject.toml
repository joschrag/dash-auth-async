[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dash-auth-async"
version = "1.2.1"
description = "Dash Authorization Package."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jonas Schrage", email = "119843859+joschrag@users.noreply.github.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Front-Ends",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Widget Sets",
]
dependencies = [
    "authlib>=1.7.2",
    "flask>=3.1.3",
    "werkzeug>=3.1.8",
    "dash>=2",
]

[project.optional-dependencies]
fastapi = ["dash[fastapi]>=4.2.0"]
quart = ["dash[quart]>=4.2.0","httpx>=0.23.0"]
async = ["dash[async]>=4.2.0"]

[project.urls]
Homepage = "https://github.com/joschrag/dash-auth-async"
"Original project" = "https://github.com/plotly/dash-auth"

[tool.setuptools.packages.find]
include = ["dash_auth_async*"]

[dependency-groups]
dev = [
    "asgiref>=3.11.1",
    "creosote>=5.2.0",
    "dash[testing]>=4.2.0",
    "setuptools>=79.0.1",
    "ty>=0.0.46",
    "pre-commit>=3.5.0",
    "pytest>=8.3.5",
    "ruff>=0.15.16",
    "pytest-cov>=7.1.0",
    "websocket-client>=1.9.0",
    "requests[security]>=2.34.2",
    "fastapi",
    "starlette",
    "uvicorn",
    "httpx>=0.23.0",
    "itsdangerous",
    "python-multipart"
]

[tool.uv]
constraint-dependencies = [
    "setuptools<80",
    # GHSA: cryptography wheels < 48.0.1 bundle a vulnerable OpenSSL
    # (advisory 2026-06-09). Pulled in transitively via authlib.
    "cryptography>=48.0.1",
]
override-dependencies = [
    "urllib3>=2.7.0",
    "selenium>=4.6.0",
]

[tool.creosote]
venvs = [".venv"]
paths = ["dash_auth_async"]
deps-file = "pyproject.toml"
sections = ["project.dependencies"]
exclude-deps = []

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
preview = true
select = ["FAST","I","D","DOC","PL","UP","PERF","RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests are self-describing and have different idioms than library code:
"tests/**" = [
    "D",        # don't require docstrings on every test/fixture/module
    "DOC",      # ...nor docstring sections (Returns, etc.)
    "PLR2004",  # status-code literals (200/401/...) read clearer than named constants in asserts
    "PLC0415",  # local imports are fine for optional deps and lazy fixtures
    "PLC2701",  # tests legitimately import private names to exercise internals
    "PLR6301",  # mock methods match a backend's instance interface; can't be static
    "PLR0913",  # mocks/fixtures mirror real signatures, including wide ones
    "PLR0917",  # ...same, for positional-argument count
    "PERF203",  # try/except in a loop is irrelevant in test setup
    "RUF029",   # async mocks intentionally match an awaited interface without awaiting
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.pydocstyle]
convention = "google"