[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dash-auth-async"
version = "1.3.5"
description = "Dash Authorization Package."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jonas Schrage", email = "119843859+joschrag@users.noreply.github.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Front-Ends",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Widget Sets",
]
dependencies = [
    "authlib>=1.9.1",
    "flask>=3.1.3",
    "werkzeug>=3.1.8",
    "dash>=2",
]

[project.optional-dependencies]
fastapi = ["dash[fastapi]>=4.2.0"]
quart = ["dash[quart]>=4.2.0","httpx>=0.23.0"]
async = ["dash[async]>=3.1.0"]

[project.urls]
Homepage = "https://github.com/joschrag/dash-auth-async"
"Original project" = "https://github.com/plotly/dash-auth"

[tool.setuptools.packages.find]
include = ["dash_auth_async*"]

[dependency-groups]
dev = [
    "asgiref>=3.11.1",
    "creosote>=5.2.0",
    "dash[testing]>=4.2.0",
    "setuptools>=79.0.1",
    "ty==0.0.51",
    "pre-commit>=3.5.0",
    "pytest>=8.3.5",
    "ruff==0.15.18",
    "pytest-cov>=7.1.0",
    "websocket-client>=1.9.0",
    "requests[security]>=2.34.2",
    "fastapi",
    "starlette",
    "uvicorn",
    "httpx>=0.23.0",
    "itsdangerous",
    "python-multipart"
]

[tool.uv]
constraint-dependencies = [
    # GHSA-g6cj-pr64-35w5: PKCS#7 EnvelopedData decryption Bleichenbacher
    # oracle below 50.0.0. Pulled in transitively via authlib.
    "cryptography>=50.0.0",
    # GHSA-h35f-9h28-mq5c: MANIFEST.in exclusion bypass via NFC/NFD
    # collision below 83.0.0. Pulled in transitively via dash/build backend.
    "setuptools>=83.0.0",
    # GHSA-ffq3-xpv3-j92q and others: quadratic-time parsing / XSS / path
    # traversal below 3.3.0. Pulled in transitively via nbconvert.
    "mistune>=3.3.0",
    # GHSA-vj7q-gjh5-988w: WebSocket transport missing Host/Origin
    # validation below 1.28.1. Pulled in transitively via dash.
    "mcp>=1.28.1",
    # GHSA-6hr6-w5qg-qmwg: duplicate Host header request-smuggling risk
    # at and below 4.4.0. Pulled in transitively via hypercorn.
    "h2>=4.4.1",
    # GHSA-mpf4-983q-p7j4 and others: unbounded urlencoded/multipart
    # parsing DoS at and below 6.5.7, plus Dependabot alerts fixed in 6.6.
    # tornado 6.6 needs Python 3.11+, so the 3.10 floor stays at 6.5.8.
    # Pulled in transitively via jupyter-client.
    "tornado>=6.6; python_version >= '3.11'",
    "tornado>=6.5.8",
]
override-dependencies = [
    "urllib3>=2.7.0",
    "selenium>=4.6.0",
]

[tool.creosote]
venvs = [".venv"]
paths = ["dash_auth_async"]
deps-file = "pyproject.toml"
sections = ["project.dependencies"]
exclude-deps = []

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
preview = true
select = ["FAST","I","D","DOC","PL","UP","PERF","RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests are self-describing and have different idioms than library code:
"tests/**" = [
    "D",        # don't require docstrings on every test/fixture/module
    "DOC",      # ...nor docstring sections (Returns, etc.)
    "PLR2004",  # status-code literals (200/401/...) read clearer than named constants in asserts
    "PLC0415",  # local imports are fine for optional deps and lazy fixtures
    "PLC2701",  # tests legitimately import private names to exercise internals
    "PLR6301",  # mock methods match a backend's instance interface; can't be static
    "PLR0913",  # mocks/fixtures mirror real signatures, including wide ones
    "PLR0917",  # ...same, for positional-argument count
    "PERF203",  # try/except in a loop is irrelevant in test setup
    "RUF029",   # async mocks intentionally match an awaited interface without awaiting
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
# Keep aliased imports on the same line as their siblings so a single
# optional-dependency import guard stays one statement (avoids PLW0717).
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"