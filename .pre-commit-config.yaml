repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.9.18
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
    -   id: ruff-format
    -   id: ruff
        args: [--fix, --exit-non-zero-on-fix]
  - repo: https://github.com/fredrikaverpil/creosote
    rev: v5.2.0
    hooks:
    -   id: creosote
  - repo: local
    hooks:
    -   id: uv-mypy
        name: uv mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [--package, dash_auth]