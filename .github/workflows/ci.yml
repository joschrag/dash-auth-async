name: CI

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync dev dependencies
        # Install the optional extras (quart/fastapi/oidc) so `ty check`
        # can resolve those imports instead of failing on unresolved
        # modules in the quart-only code paths.
        run: uv sync --group dev --all-extras

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Ty
        run: uv run ty check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Explicitly carve out the "Early Dash 4" dead-zone
        dash-constraint: ["dash[testing]>=3,<4", "dash[testing]>=4,<4.2.0", "dash[testing]>=4.2.0"]
        include:
          - dash-constraint: "dash[testing]>=3,<4"
            extra-flags: ".[oidc]"
          - dash-constraint: "dash[testing]>=4,<4.2.0"
            extra-flags: ".[oidc]" # No async extras yet!
          - dash-constraint: "dash[testing]>=4.2.0"
            extra-flags: ".[oidc,fastapi,quart]"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: "stable"

      # This now cleanly maps to the version of Dash being forced
      - name: Install
        run: |
          pip install \
            "${{ matrix.dash-constraint }}" \
            -e "${{ matrix.extra-flags }}" \
            pytest

      - name: Test
        run: pytest --headless

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build package with uv
        run: uv build

  all-checks-pass:
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed"
