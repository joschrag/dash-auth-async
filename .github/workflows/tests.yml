name: Tests

# Read-only token: these jobs only check out code; Codecov uses its own token.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Locked compiled deps (pydantic-core, lxml, ...) may lack 3.15 wheels and
    # build from source; don't block on 3.15 until Dependabot bumps them.
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # Explicitly carve out the "Early Dash 4" dead-zone
        dash-constraint: ["dash[testing]>=3,<4", "dash[testing]>=4,<4.2.0", "dash[testing,diskcache]>=4.2.0"]
        include:
          - dash-constraint: "dash[testing]>=3,<4"
            extra-flags: ".[oidc,async]"
          - dash-constraint: "dash[testing]>=4,<4.2.0"
            extra-flags: ".[oidc,async]" # No async extras yet!
          - dash-constraint: "dash[testing,diskcache]>=4.2.0"
            extra-flags: ".[oidc,fastapi,quart,async]"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: "stable"

      # Pin every dependency except dash to uv.lock, so CI tests what the lock
      # ships; dash itself floats within each matrix row's range.
      - name: Install
        run: |
          uv export --frozen --no-hashes --all-extras --group dev             --no-emit-project --no-emit-package dash -o constraints.txt
          uv venv --python ${{ matrix.python-version }}
          uv pip install -c constraints.txt             "${{ matrix.dash-constraint }}"             -e "${{ matrix.extra-flags }}"             pytest websocket-client

      - name: Test
        run: uv run --no-sync pytest --headless

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: "stable"

      - name: Install
        run: uv sync --frozen --group dev --all-extras

      - name: Test with coverage
        run: uv run --no-sync pytest --headless --cov=dash_auth_async --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build package with uv
        run: uv build

  # The one check branch rules require, so matrix changes never need a ruleset
  # edit. always() is load-bearing: a skipped required check counts as passing.
  tests-passed:
    if: always()
    needs: [test, coverage]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.test.result }}" = success
          test "${{ needs.coverage.result }}" = success
