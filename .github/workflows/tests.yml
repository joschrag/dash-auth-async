name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Explicitly carve out the "Early Dash 4" dead-zone
        dash-constraint: ["dash[testing]>=3,<4", "dash[testing]>=4,<4.2.0", "dash[testing]>=4.2.0"]
        include:
          - dash-constraint: "dash[testing]>=3,<4"
            extra-flags: ".[oidc,async]"
          - dash-constraint: "dash[testing]>=4,<4.2.0"
            extra-flags: ".[oidc,async]" # No async extras yet!
          - dash-constraint: "dash[testing]>=4.2.0"
            extra-flags: ".[oidc,fastapi,quart,async]"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: "stable"

      # This now cleanly maps to the version of Dash being forced
      - name: Install
        run: |
          pip install \
            "${{ matrix.dash-constraint }}" \
            -e "${{ matrix.extra-flags }}" \
            pytest websocket-client

      - name: Test
        run: pytest --headless

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: "stable"

      - name: Install
        run: |
          pip install \
            "dash[testing]>=4.2.0" \
            -e ".[oidc,fastapi,quart]" \
            pytest pytest-cov websocket-client

      - name: Test with coverage
        run: pytest --headless --cov=dash_auth_async --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build package with uv
        run: uv build
