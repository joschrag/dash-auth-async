name: Lint

# Read-only token: these jobs only check out code; Codecov uses its own token.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes its running checks; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync dev dependencies
        run: uv sync --group dev --all-extras

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
