name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check if new version
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.version-check.outputs.new }}
      tag: ${{ steps.version-check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Check if version is new
        id: version-check
        run: |
          PKG=$(uv version --short)
          TAG="v${PKG}"
          if git tag | grep -qx "$TAG"; then
            echo "Version $TAG already tagged, skipping release"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

  pypi-publish:
    name: Tag and upload release to PyPI
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dash-auth-async/
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Create and push tag
        run: |
          git tag "${{ needs.check.outputs.tag }}"
          git push origin "${{ needs.check.outputs.tag }}"

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
